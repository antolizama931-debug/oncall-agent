services:
  - type: web
    name: oncall-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ONCALL_ENV
        value: production
      - key: ONCALL_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: ONCALL_DAILY_LIMIT
        value: "30"
      - key: ONCALL_ALLOW_RULE_FALLBACK
        value: "true"
      - key: ONCALL_STATUS_CACHE_SECONDS
        value: "300"
      - key: ONCALL_STATUS_SCENARIO_LIMIT
        value: "6"
      - key: ONCALL_MAX_RUNS
        value: "100"
      - key: ONCALL_MAX_DOCUMENTS
        value: "20"
      - key: ONCALL_MAX_SESSIONS
        value: "100"
      - key: ONCALL_MAX_SESSION_MESSAGES
        value: "16"
      - key: ONCALL_DENSE_MIN_SCORE
        value: "0.36"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_MAX_TOKENS
        value: "2200"
